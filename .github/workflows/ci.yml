name: ci

on:
  # PR trigger は base branch 制限なし (stacked PR: <issue-number> -> <predecessor-issue-number>
  # でも CI が走る)。push は main / release-* のみ (ticket branch 直 push は PR 経由が canonical)。
  # 詳細は docs/adr/0003-release-branch-stack-protection.md を参照。
  pull_request:
  push:
    branches: [main, "release-*"]

# CI は read-only を基本に、必要最小限の権限だけを要求する。
permissions:
  contents: read

concurrency:
  # 同一 PR/branch の CI は古い run をキャンセルする。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 検証ステップは必ず canonical gate entry point (scripts/quality-gate.sh
# 経由 / package.json `gate:*` scripts) を呼ぶ。個別の lint /
# typecheck / test:unit / build / test:e2e を CI から直接呼ばない。
# canonical profile は quality/profile.yaml、driver は
# .agents/skills/quality-gate/SKILL.md §4。

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # LayoutProps などの typed routes 用型は next build / dev 時に .next/types へ出力される。
      # typecheck を build より先に走らせるため、先に typegen だけ走らせて型生成だけ行う。
      - name: Generate Next.js types
        run: bunx next typegen

      # Canonical integration gate (lint + typecheck + test:unit + build)。
      # CI から個別 lint / typecheck / test / build を直接呼ばない。
      - name: Run canonical gate:integration
        run: bun run gate:integration
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify static export artifact
        run: |
          # index.html と Pages 用のカスタム 404 (out/404.html) の両方が
          # 存在することを確認する。out/404.html は scripts/ensure-pages-404.ts
          # (postbuild) が out/404/index.html からコピーして生成する —
          # GitHub Pages は root の 404.html のみを custom 404 として
          # 扱うため。
          test -f out/index.html || (echo "out/index.html が生成されていません" && exit 1)
          test -f out/404.html || (echo "out/404.html が生成されていません (Pages custom-404)" && exit 1)

  e2e:
    name: E2E gate (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # E2E は quality gate の後に走らせ、`gate:e2e` を canonical 入口として
    # このジョブ内で build + Playwright を完結させる (Playwright は ./out
    # を fresh build 前提で serve するため)。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Next.js types
        run: bunx next typegen

      # Canonical e2e gate (build + Playwright)。CI から個別 build /
      # test:e2e / test:e2e:install を直接呼ばない (test:e2e:install は
      # gate:e2e 内の test:e2e script が暗黙で必要とする)。
      - name: Install Playwright browsers
        run: bun run test:e2e:install

      - name: Run canonical gate:e2e
        run: bun run gate:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
