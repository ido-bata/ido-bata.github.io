name: deploy

on:
  # main への push / 手動実行で GitHub Pages へ配信する。
  # release-* ブランチは docs/release.md#リリースフロー のとおり main 経由でのみ反映する。
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deploy および OIDC トークンでの Actions 実行に必要な権限。
# pull-requests: read は Dependabot 等の PR でも安全に走れるように最小権限で付与。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時 deploy を避けるため、同一 ref の in-progress を待つ。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate (lint / typecheck)
        run: |
          bun run lint
          bun run typecheck

      - name: Build static export
        run: bun run build
        env:
          # CI 用に固定値（GitHub Actions から渡ってくる値があれば優先）
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # deploy は他ブランチの in-progress deploy および他の同時実行と衝突させない。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4