name: deploy

on:
  # main への push / 手動実行で GitHub Pages へ配信する。
  # release-* ブランチは docs/release.md#リリースフロー のとおり main 経由でのみ反映する。
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deploy および OIDC トークンでの Actions 実行に必要な権限。
# pull-requests: read は Dependabot 等の PR でも安全に走れるように最小権限で付与。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時 deploy を避けるため、同一 ref の in-progress を待つ。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 静的書き出しで typed routes 用の型を先に生成してから lint / typecheck を流す。
      - name: Generate Next.js types
        run: bunx next typegen

      - name: Run quality gate (lint / typecheck)
        run: |
          bun run lint
          bun run typecheck

      - name: Build static export
        run: bun run build
        env:
          # CI 用に固定値（GitHub Actions から渡ってくる値があれば優先）
          NEXT_TELEMETRY_DISABLED: "1"
          # Pages deploy で Discord 招待 URL をバンドルへ焼き込む。
          # `output: "export"` 環境では runtime 差し替え不可なので、build 時に必ず渡す。
          # repo-level variables (Settings → Secrets and variables → Variables) で
          # `NEXT_PUBLIC_DISCORD_INVITE` を設定する。未設定なら `src/lib/env.ts` が
          # undefined として扱い、Header / Footer / Home / 404 の CTA は
          # プレースホルダ表示に退避するので build は壊れない。
          NEXT_PUBLIC_DISCORD_INVITE: ${{ vars.NEXT_PUBLIC_DISCORD_INVITE }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # deploy は他ブランチの in-progress deploy および他の同時実行と衝突させない。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
